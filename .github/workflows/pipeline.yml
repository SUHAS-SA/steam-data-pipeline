name: Steam Data Pipeline ETL

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Extraction Stage
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          python -m src.pipeline --stage extract

      - name: Run Transformation Stage
        run: |
          python -m src.pipeline --stage transform

      - name: Commit & Push Updated Data to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: automated steam dataset update [skip ci]"
          branch: main
          file_pattern: "app_rawdata/*.jsonl new_sql_files/*.sql steam_apps.json update_log.txt"
